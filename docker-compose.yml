# Local portfolio demo: PostgreSQL/pgvector + FastAPI + Streamlit.
# Secrets come from an ignored .env at runtime and are never baked into images.
services:
  postgres:
    image: ${PGVECTOR_IMAGE:-pgvector/pgvector:pg16}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resume_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-resume}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "alembic upgrade head && uvicorn api.main:app --host 0.0.0.0 --port 8000 --no-access-log"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-resume}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-resume_intelligence}
      RETRIEVAL_AUTH_TOKENS_JSON: ${RETRIEVAL_AUTH_TOKENS_JSON:-{}}
      GENERATION_TENANT_POLICY_JSON: ${GENERATION_TENANT_POLICY_JSON:-{}}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      GENAI_INPUT_USD_PER_MILLION_TOKENS: ${GENAI_INPUT_USD_PER_MILLION_TOKENS:-}
      GENAI_OUTPUT_USD_PER_MILLION_TOKENS: ${GENAI_OUTPUT_USD_PER_MILLION_TOKENS:-}
      LANGGRAPH_STRICT_MSGPACK: "true"
      HF_HOME: /models/huggingface
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - model_cache:/models
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m ingestion.worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-resume}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-resume_intelligence}
      INGESTION_MAX_ATTEMPTS: ${INGESTION_MAX_ATTEMPTS:-3}
      INGESTION_RETRY_BASE_SECONDS: ${INGESTION_RETRY_BASE_SECONDS:-5}
      INGESTION_LEASE_SECONDS: ${INGESTION_LEASE_SECONDS:-600}
      INGESTION_POLL_SECONDS: ${INGESTION_POLL_SECONDS:-2}
      HF_HOME: /models/huggingface
    volumes:
      - model_cache:/models
    depends_on:
      api:
        condition: service_healthy
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    command: streamlit run app.py --server.address=0.0.0.0 --server.port=8501 --server.headless=true
    environment:
      # Internal service name; the browser never talks to the API or sees the token.
      API_BASE_URL: http://api:8000
      API_TENANT_ID: ${API_TENANT_ID:-demo-tenant}
      API_BEARER_TOKEN: ${API_BEARER_TOKEN:-}
      # Optional: enables the original per-candidate Gemini enrichment in Candidate Ranking.
      GEMINI_API_KEY: ${STREAMLIT_GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      HF_HOME: /models/huggingface
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    volumes:
      - model_cache:/models
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s


volumes:
  postgres_data:
  model_cache:
