[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# Supply DATABASE_URL at runtime. This passwordless local default is only a
# parser-safe fallback and is not a deployable credential configuration.
sqlalchemy.url = postgresql+psycopg://localhost/resume_intelligence

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
