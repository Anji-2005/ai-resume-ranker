name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: resume_intelligence_test
          POSTGRES_USER: resume_test
          POSTGRES_PASSWORD: ci-test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resume_test -d resume_intelligence_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      DATABASE_URL: postgresql+psycopg://resume_test:ci-test-only-password@localhost:5432/resume_intelligence_test
      TEST_DATABASE_URL: postgresql+psycopg://resume_test:ci-test-only-password@localhost:5432/resume_intelligence_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: alembic check
      - run: python -m evals.run_whole_document_baseline
      - run: python -m evals.run_generation_eval
      - run: python -m evals.run_offline_quality_eval
      - run: python -m evals.run_investigation_eval
      - run: python -m evals.run_ingestion_benchmark --database-url "$TEST_DATABASE_URL"
      - run: python -m evals.quality_gate
      - run: python -m pip_audit --cache-dir /tmp/pip-audit --local
      - run: cyclonedx-py requirements requirements.txt --output-file sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: python-sbom
          path: sbom.cdx.json
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-compose-config-only
      - run: docker build --tag ai-resume-ranker:ci .
      - run: >-
          docker run --rm ai-resume-ranker:ci python -c
          "import torch; assert '+cpu' in torch.__version__; assert not torch.cuda.is_available(); assert torch.version.cuda is None"
