[theme]
primaryColor = "#2563EB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F6FA"
textColor = "#172033"
font = "sans-serif"

[server]
maxUploadSize = 10
headless = true

[browser]
# No usage telemetry leaves the deployment.
gatherUsageStats = false

[client]
# Show only the exception type for uncaught errors; never messages or tracebacks.
showErrorDetails = "type"
